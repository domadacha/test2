name: test2
run-name: Build `test2` with `test2` ⛵️
on: [ push ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: hashicorp/vault-action@v2
        with:
          url: http://127.0.0.1:8081
          method: approle
          roleId: test
          secretId: test2
          secrets: |
            automation/data/actions-it/github URL | GIT_WEBHOOK_URL
      - uses: actions/checkout@v3
      - uses: domadacha/test2@main
        with:
          verb: 'build'
